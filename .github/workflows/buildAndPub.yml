            NODE_VERSION=${{ steps.parse_version.outputs.PARSED_VERSION }}
          tags: |
            ${{ env.FORGEJO_IMAGE }}:devcontainer-${{steps.parse_version.outputs.PARSED_VERSION}}
            ${{ env.FORGEJO_IMAGE }}:devcontainer-${{matrix.tag.major}}
            ${{ steps.is_latest.outputs.IS_LATEST == 'true' && format('{0}:devcontainer-latest', env.FORGEJO_IMAGE) || '' }}

      - name: Login to DockerHub
        id: dockerhub_login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          logout: true

      - name: Mirror the built image to DockerHub
        id: mirror
        if: steps.dockerhub_login.outcome == 'success'
        continue-on-error: true
        run: |
          tags=(--tag "${{ env.DOCKERHUB_IMAGE }}:devcontainer-${{ steps.parse_version.outputs.PARSED_VERSION }}"
                --tag "${{ env.DOCKERHUB_IMAGE }}:devcontainer-${{ matrix.tag.major }}")
          if [ "${{ steps.is_latest.outputs.IS_LATEST }}" = true ]; then
            tags+=(--tag "${{ env.DOCKERHUB_IMAGE }}:devcontainer-latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${{ env.FORGEJO_IMAGE }}@${{ steps.build_image.outputs.digest }}"

      - name: Write manifest part
        run: |
          TAGS=$(jq -nc \
            --arg v "${{ steps.parse_version.outputs.PARSED_VERSION }}" \
            --arg m "${{ matrix.tag.major }}" \
            --arg latest "${{ steps.is_latest.outputs.IS_LATEST }}" \
            --arg dockerhub "${{ env.DOCKERHUB_IMAGE }}" \
            --argjson mirrored "${{ steps.mirror.outcome == 'success' }}" \
            --arg forgejo "${{ env.FORGEJO_IMAGE }}" \
            '[($dockerhub + ":devcontainer-" + $v), ($dockerhub + ":devcontainer-" + $m), ($forgejo + ":devcontainer-" + $v), ($forgejo + ":devcontainer-" + $m)] + (if $latest == "true" then [($dockerhub + ":devcontainer-latest"), ($forgejo + ":devcontainer-latest")] else [] end) | if $mirrored then . else map(select(startswith($dockerhub + ":") | not)) end')
          jq -n \
            --arg version "${{ steps.parse_version.outputs.PARSED_VERSION }}" \
            --argjson major ${{ matrix.tag.major }} \
            --arg variant "devcontainer" \
            --argjson platforms '["linux/amd64"]' \
            --argjson tags "$TAGS" \
            --arg digest "${{ steps.build_image.outputs.digest }}" \
            --argjson is_latest ${{ steps.is_latest.outputs.IS_LATEST }} \
            '{version:$version, major:$major, variant:$variant, platforms:$platforms, tags:$tags, digest:$digest, is_latest:$is_latest}' \
            > part.json
          cat part.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-part-devcontainer-${{ matrix.tag.major }}
          path: part.json

  build-dind:
    needs: [prepare-matrix, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.prepare-matrix.outputs.devcontainer_matrix)}}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Forgejo
        uses: docker/login-action@v4
        with:
          registry: code.bettercorp.dev
          username: ${{ secrets.BC_CODE_USER }}
          password: ${{ secrets.BC_CODE_PACKAGE_TOKEN }}
