      - name: Parse version
        id: parse_version
        run: |
          VERSION=${{ matrix.tag.version }}
          PARSED_VERSION=${VERSION#v}
          echo "PARSED_VERSION=$PARSED_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Is Latest
        id: is_latest
        run: |
          if [ "${{ matrix.tag.version }}" = "${{ needs.prepare-matrix.outputs.latest }}" ]; then
            echo "IS_LATEST=true" >> $GITHUB_OUTPUT
            echo "This is the latest version"
          else
            echo "IS_LATEST=false" >> $GITHUB_OUTPUT
            echo "This is not the latest version"
          fi

      - name: Build and push dind image to Forgejo
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dind
          push: true
          build-args: |
            BASE_IMAGE=${{ env.FORGEJO_IMAGE }}
            NODE_MAJOR=${{ matrix.tag.major }}
            NODE_VERSION=${{ steps.parse_version.outputs.PARSED_VERSION }}
          tags: |
            ${{ env.FORGEJO_IMAGE }}:dind-${{steps.parse_version.outputs.PARSED_VERSION}}
            ${{ env.FORGEJO_IMAGE }}:dind-${{matrix.tag.major}}
            ${{ steps.is_latest.outputs.IS_LATEST == 'true' && format('{0}:dind-latest', env.FORGEJO_IMAGE) || '' }}

      - name: Login to DockerHub
        id: dockerhub_login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          logout: true

      - name: Mirror the built image to DockerHub
        id: mirror
        if: steps.dockerhub_login.outcome == 'success'
        continue-on-error: true
        run: |
          tags=(--tag "${{ env.DOCKERHUB_IMAGE }}:dind-${{ steps.parse_version.outputs.PARSED_VERSION }}"
                --tag "${{ env.DOCKERHUB_IMAGE }}:dind-${{ matrix.tag.major }}")
          if [ "${{ steps.is_latest.outputs.IS_LATEST }}" = true ]; then
            tags+=(--tag "${{ env.DOCKERHUB_IMAGE }}:dind-latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${{ env.FORGEJO_IMAGE }}@${{ steps.build_image.outputs.digest }}"

      - name: Write manifest part
